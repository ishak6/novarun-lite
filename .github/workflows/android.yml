name: Android CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK path
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build minified release APK
        run: gradle :app:assembleRelease
      - name: Sign QA APK with ephemeral debug key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/app-release-qa.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release-qa.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: novarun-lite-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload minified release APK
        uses: actions/upload-artifact@v5
        with:
          name: novarun-lite-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload installable QA APK
        uses: actions/upload-artifact@v5
        with:
          name: novarun-lite-release-qa-signed
          path: app/build/outputs/apk/release/app-release-qa.apk
